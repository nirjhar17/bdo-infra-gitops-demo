apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: bdo-acm-local
  namespace: bdo-acm-policies
spec:
  clusterSets:
    - default
  numberOfClusters: 1
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            name: local-cluster
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: bdo-acm-local
  namespace: bdo-acm-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: bdo-acm-local
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: bdo-acm-workspace
