apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bdo-acm-workspace
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/nirjhar17/bdo-infra-gitops-demo.git
    targetRevision: main
    path: acm/namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: bdo-acm-policies
  syncPolicy:
    syncOptions:
      - Prune=false
